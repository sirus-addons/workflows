name: Addon release
'on':
  workflow_call:
jobs:
  release:
    name: Create release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check pack
        id: pack
        run: |
          if [ -f addon-meta.yml ] && grep -Eq '^name:[[:space:]]*[^[:space:]]' addon-meta.yml && ! grep -Eq '^directories:[[:space:]]*\[[[:space:]]*\][[:space:]]*$' addon-meta.yml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::addon-meta.yml is not filled in yet, no release"
          fi
      - name: Build zip
        if: steps.pack.outputs.ready == 'true'
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          zip -r "$repo" . -x '*.git*' 'README.md' 'addon-meta.yml' '.travis.yml' '.github/*' '.screenshots/*' '.vscode/*' '.idea/*'
      - name: Create release
        if: steps.pack.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          now=$(date -u +%s)
          tag="$(git rev-parse --short HEAD)-$(date -u -d "@$now" +'%Y%m%d%H%M')"
          title="$repo - $(date -u -d "@$now" +'%Y-%m-%d %H:%M')"
          gh release create "$tag" "$repo.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "" --latest
